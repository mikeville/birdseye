# Netlify config for the Birdseye prototype deploy.
#
# basemap.pmtiles is hosted as a GitHub Release asset (the file is gitignored
# at 142 MB — too large to push, regenerated by scripts/build-data.sh). The
# release URL serves without CORS headers, so the browser can't fetch it
# cross-origin from the deployed site. This rewrite proxies the file through
# Netlify's edge so the browser sees a same-origin request.
#
# When deployed standalone:
#   browser → despin.netlify.app/basemap.pmtiles
#         → Netlify edge proxies → github.com/.../basemap.pmtiles
#
# When proxied through the portfolio at mikemake.com/despin/:
#   browser → mikemake.com/despin/basemap.pmtiles
#         → portfolio's rewrite → despin.netlify.app/basemap.pmtiles
#         → this rewrite       → github.com/.../basemap.pmtiles
#
# Range requests pass through both hops, so pmtiles' partial fetches work.

[build]
  command = "pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/basemap.pmtiles"
  to = "https://github.com/mikeville/birdseye/releases/download/basemap-v1/basemap.pmtiles"
  status = 200
  force = true
