# Netlify config for the Birdseye prototype deploy.
#
# basemap.pmtiles is hosted in a Cloudflare R2 bucket (the file is gitignored
# at 142 MB — too large to push, regenerated by scripts/build-data.sh). This
# rewrite proxies the file through Netlify's edge so the browser fetches it
# same-origin (no CORS), and so the same /basemap.pmtiles URL keeps working
# whether the app is at despin.netlify.app/ or behind mikemake.com/despin/.
#
# When deployed standalone:
#   browser → despin.netlify.app/basemap.pmtiles
#         → Netlify edge proxies → R2 bucket
#
# When proxied through the portfolio at mikemake.com/despin/:
#   browser → mikemake.com/despin/basemap.pmtiles
#         → portfolio's rewrite → despin.netlify.app/basemap.pmtiles
#         → this rewrite       → R2 bucket
#
# Range requests pass through both hops, so pmtiles' partial fetches work.

[build]
  command = "pnpm run build"
  publish = "dist"

[[redirects]]
  from = "/basemap.pmtiles"
  to = "https://pub-77d68d12355d40e7ab630bf923c21c3d.r2.dev/despin/basemap.pmtiles"
  status = 200
  force = true
